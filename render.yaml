services:
  - type: web
    name: find-partner-vip
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:web --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "7044754988"
      - key: DB_PATH
        value: /var/data/find_partner_vip.sqlite3
      - key: OFFICIAL_GROUP
        value: https://t.me/chatgcv1
      - key: OFFICIAL_CHANNEL
        value: https://t.me/arx_smediaexpert
    disk:
      name: find-partner-data
      mountPath: /var/data
      sizeGB: 1
      
